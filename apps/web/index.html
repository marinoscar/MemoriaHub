<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MemoriaHub — your personal media hub" />
    <title>MemoriaHub</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      PWA (issue #482). `manifest.webmanifest` is generated by `VitePWA` from
      `pwa/manifest.ts`; there is no committed copy in `public/`, and the
      plugin INJECTS the manifest link tag itself (dev and build), so
      there is deliberately none written here — one would be a duplicate. The service
      worker is registered from the React tree (`components/pwa/UpdatePrompt.tsx`),
      so there is no registration script tag here.

      The `apple-mobile-web-app-*` metas are for iOS, where Safari grants the
      Notifications / Push APIs only to a web app added to the Home Screen:
      `-capable` is the pre-16.4 spelling of the manifest's standalone request,
      and `-title` names the Home Screen icon. Keep `theme-color` in step with
      `THEME_COLOR` in `pwa/manifest.ts` (asserted by the manifest test).
    -->
    <meta name="theme-color" content="#1976d2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MemoriaHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
