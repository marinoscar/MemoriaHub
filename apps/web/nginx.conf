server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA entry points must NOT be cached (issue #482). Exact-match (`=`)
    # locations take precedence over the regex block below; without them
    # `sw.js` matches `\.(js|...)$` and is served `immutable` for a year.
    #
    # That is exactly wrong for these files: the browser re-fetches the worker
    # script to DISCOVER updates, so an immutable `sw.js` is a deploy users may
    # not receive (the precached shell of the old revision keeps being served).
    # Everything the worker precaches is content-hashed (`assets/*-<hash>.js`)
    # and stays immutable below; only the unhashed entry points revalidate.
    # `registerSW.js` is not emitted today (`injectRegister: null` — the React
    # tree registers the worker) but is covered in case that ever changes.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The manifest: revalidated so install metadata changes reach users, and
    # served with its real MIME type — nginx's stock `mime.types` has no
    # `.webmanifest` entry, and the outer proxy sends `nosniff`. The empty
    # `types {}` makes `default_type` apply to this location.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
