# The Android app's version: the single source of truth for local, CLI and CI builds.
# versionCode must strictly increase for every published APK (Android refuses downgrades)
# and stay within 1..2100000000.
# Bump it with the CLI (`memoriahub android version --bump patch`, issue #517) or edit both lines.
# -Papp.versionName / -Papp.versionCode override these for a single build.
versionName=2.0.0
versionCode=100
