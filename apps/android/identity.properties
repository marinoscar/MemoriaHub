# Product identity of the Android app, read by app/build.gradle.kts (and by the CLI and CI).
#
# Java properties: a '#' starts a comment only at the beginning of a line, so never put a
# comment after a value on the same line.
#
# applicationId is case-sensitive everywhere it appears (assetlinks.json, the Play-less
# sideload install, the server's trusted-app list). The debug build appends ".debug".
# The legacy v1 app used cr.marin.memoriahub: a different package, so both can be installed.
productName=MemoriaHub
applicationId=memoriahub.marin.cr
# Custom scheme of the app's deep links (memoriahub://media-sync, ...). Already accepted by the
# API's sanitizeReturnUri for the device-flow returnUri.
deepLinkScheme=memoriahub
# Prefix of SharedPreferences files and other on-device names (<prefix>_config, <prefix>_secure).
# Never change it for a shipped app: renamed files lose the server address and the pairing.
storagePrefix=memoriahub
# Brand colours. The build fails unless they equal THEME_COLOR / BACKGROUND_COLOR in
# apps/web/pwa/manifest.ts, so the TWA's status bar and splash match the installed PWA.
themeColor=#1976d2
backgroundColor=#ffffff
# File-name stem of published APKs (<apkStem>-<versionName>.apk); used by the CLI and CI.
apkStem=memoriahub-android
