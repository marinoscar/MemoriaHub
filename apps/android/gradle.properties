# Keep the build friendly to shared CI runners and small dev machines.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Product identity (name, applicationId, deep-link scheme, colours) comes from identity.properties,
# the version from version.properties; see app/build.gradle.kts and README.md.
# Build-time overrides go on the command line, e.g.
#   -Papp.serverUrl=https://photos.example.com -Papp.versionName=2.0.1 -Papp.versionCode=101
