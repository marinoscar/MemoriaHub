# =============================================================================
# Nginx Configuration - Reverse Proxy (Production)
# =============================================================================
# Routes:
#   /           -> web (React frontend — static nginx on :80 in production)
#   /api        -> api (NestJS backend)
#   /api/docs   -> api (Swagger UI)
#   /.well-known/assetlinks.json -> api (/api/well-known/assetlinks.json)
#
# Difference from nginx.conf (dev):
#   web_upstream -> server web:80  (production nginx static, not Vite :5173)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large photo/video uploads through the simple-upload endpoint
    # (POST /api/storage/objects). Matches the host nginx limit and the
    # MAX_FILE_SIZE app setting (10GB). Resumable multipart uploads go
    # directly to S3 via pre-signed URLs and bypass nginx entirely.
    client_max_body_size 10g;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Upstream definitions
    upstream api_upstream {
        server api:3000;
        keepalive 32;
    }

    # Production: web container serves static files via nginx on :80
    upstream web_upstream {
        server web:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # PWA / service worker (issue #482): nothing here may block it. There is
        # deliberately NO Content-Security-Policy on this proxy; if one is ever
        # added it must allow `worker-src 'self'` (or a `script-src 'self'` it
        # falls back to) and `manifest-src 'self'`, or `/sw.js` silently fails
        # to register and Web Push never works. `/sw.js` and
        # `/manifest.webmanifest` are proxied to the web container like any other
        # static file; their no-cache headers are set there
        # (`apps/web/nginx.conf`), and `X-Content-Type-Options: nosniff` above is
        # why that config must also send the manifest's real Content-Type.

        # -------------------------------------------------------------------------
        # Live notification stream (SSE) — issue #485, epic #481
        # -------------------------------------------------------------------------
        # `GET /api/notifications/stream` is a long-lived text/event-stream.
        # Through the generic `/api` block it would be BUFFERED (proxy_buffering
        # on) and cut off by the 60s read timeout. Longest-prefix match makes
        # this block win over `/api` regardless of order; it is placed first for
        # readability.
        #   proxy_buffering off / proxy_cache off — stream, do not accumulate
        #     (the API also sends `X-Accel-Buffering: no`; neither is relied on
        #     alone).
        #   proxy_read_timeout 1h — an idle stream is normal; the API sends a
        #     `ping` event every 25s, so this only fires if the API stopped.
        #   Connection '' — the `/api` block forces `Connection "upgrade"` for
        #     WebSockets; SSE is plain HTTP.
        # Verify THROUGH the proxy — buffering is invisible against :3000.
        location /api/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no;

            # Long-lived by design; the API pings every 25s
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        # -------------------------------------------------------------------------
        # Digital Asset Links (issue #503) -> NestJS backend
        # -------------------------------------------------------------------------
        # Chrome only opens the Android app (a Trusted Web Activity) full-screen
        # when this origin serves /.well-known/assetlinks.json naming its package
        # and signing-key fingerprint. The list is runtime-configured
        # (PUT /api/admin/android-app), so the API serves it rather than a
        # static file. Exact-match location: nothing else under /.well-known is
        # routed to the API. No add_header here: the API sets Content-Type and
        # Cache-Control (public, max-age=300) itself.
        location = /.well-known/assetlinks.json {
            # The URI part replaces the matched path with the API route.
            proxy_pass http://api_upstream/api/well-known/assetlinks.json;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------------------
        # API routes -> NestJS backend
        # -------------------------------------------------------------------------
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # Frontend routes -> React app (static via nginx in production)
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------------
        # Health check endpoint for nginx itself
        # -------------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
