# =============================================================================
# Android companion edge locations (APP-OWNED include)
# =============================================================================
# platform/android-app.conf (generated) carries the three locations: the
# Digital Asset Links file, the APK upload (160m, unbuffered) and the streamed
# APK download. This file only includes them, before `location /api`, so they
# take precedence over the generic API block.
# =============================================================================
include /etc/nginx/platform/android-app.conf;
