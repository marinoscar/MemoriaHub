# =============================================================================
# Multipart part uploads through the API (local storage provider) (APP-OWNED)
# =============================================================================
# PUT /api/storage/objects/:id/upload/parts/:n receives one raw part (10 MiB by
# default, STORAGE_PART_SIZE) when the storage provider has no presigned URL a
# device can reach. A regex location wins over the `/api` prefix block.
#   client_max_body_size 64m  one part, not a whole file; keep it above
#                             STORAGE_PART_SIZE if that is ever raised. The API
#                             checks the exact part size itself.
#   proxy_request_buffering off  stream the body to the API as it arrives; the
#                             API streams it straight to disk.
#   300s timeouts             a phone on a slow uplink.
# Responses inherit the server-level security headers (no add_header here).
# =============================================================================
location ~ ^/api/storage/objects/[^/]+/upload/parts/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    client_max_body_size 64m;
    proxy_request_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
