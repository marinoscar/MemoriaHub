# =============================================================================
# Request body limit of the public server (APP-OWNED)
# =============================================================================
# The hand-written nginx.prod.conf set `client_max_body_size 10g` for the whole
# http block. This keeps that ceiling for the simple single-request upload
# (POST /api/storage/objects) and every other route, because MAX_FILE_SIZE
# defaults to 10 GiB and a lower nginx limit would cap those uploads silently
# at nginx's default of 1 MB. The large routes narrow it themselves:
#   app.d/locations/app-uploads.conf      one part of a multipart upload, 64m
#   platform/android-app.conf             the APK upload, 160m
#
# Narrowing the global value to the two large routes is the follow-up to
# revisit once the simple upload path is retired.
# =============================================================================
client_max_body_size 10g;
