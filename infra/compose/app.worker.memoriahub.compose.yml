# =============================================================================
# App overlay (scope worker) - the image and the MemoriaHub worker variables
# =============================================================================
# worker.compose.yml is the platform's template and names the platform engine's
# variables (MEMORIAHUB_SERVER_URL, MEMORIAHUB_HEAP_LIMIT_MB, ...). Since
# RETRO-C10 (#616) the MemoriaHub worker IS that engine, with MemoriaHub's
# executors (apps/cli/src/executors), so no variable needs renaming here: the
# old names (MEMORIAHUB_URL, MEMORIAHUB_MAX_OLD_SPACE_MB, ...) still work for
# one release with a deprecation line (apps/cli/src/worker-env.ts).
#
#   MEMORIAHUB_SERVER_URL the API base URL (required, in .env)
#   MEMORIAHUB_TOKEN      a node credential (nod_...) or a PAT (required)
#
# The image is WORKER_IMAGE, or ghcr.io/marinoscar/memoriahub-worker at the
# WORKER_VERSION tag (default latest), as the previous bundle pinned it. The
# CLIP model and the Tesseract language data are baked into it
# (MEMORIAHUB_MODELS_DIR=/app/models).
# =============================================================================
services:
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/marinoscar/memoriahub-worker:${WORKER_VERSION:-latest}}
    stop_grace_period: ${WORKER_STOP_GRACE:-180s}
    environment:
      - MEMORIAHUB_CONCURRENCY=${MEMORIAHUB_CONCURRENCY:-2}
      - MEMORIAHUB_MODELS_DIR=/app/models
