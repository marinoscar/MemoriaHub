name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The three job definitions below (five jobs at runtime, once the web matrix
# expands) all run CONCURRENTLY on GitHub's default parallel scheduling — none
# declares `needs`. Wall-clock time to all-green is therefore the SLOWEST job,
# not the sum, and adding coverage to one job costs nothing as long as it stays
# under the current slowest. Keep it that way (issue #417).
jobs:
  build:
    name: Build & Test (API)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # apps/api and apps/cli both import @memoriahub/enrichment-compute by
      # subpath (e.g. .../clip, .../dto) resolved against its built dist/ —
      # that output is git-ignored, so it must be built here on every fresh
      # checkout before anything that imports it can typecheck or run.
      # (apps/web does NOT import it — see the web-test job.)
      - run: npm run build --workspace=@memoriahub/enrichment-compute

      - run: npx prisma generate
        working-directory: apps/api

      # `--ignore-scripts` skips api's `pretypecheck` hook, which would otherwise
      # re-run `setup:deps` — rebuilding enrichment-compute and regenerating the
      # Prisma client that the two steps above just produced. The hook exists so
      # a fresh local checkout self-provisions on `npm run typecheck`; in CI the
      # provisioning is explicit, so the hook is pure duplicated work (issue #417).
      - run: npm run typecheck --workspace=api --ignore-scripts
      - run: npm run typecheck --workspace=web

      # Unit + integration test runs. The API's integration specs boot the full
      # AppModule over a mocked Prisma — they need no database, and since #220
      # they run here rather than being excluded wholesale. Remaining exclusions
      # are tracked in docs/ci-known-failing-tests.md.
      - run: npm run test:ci --workspace=api

  web-test:
    name: Web Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # The web suite (249 files / ~5k tests) was a single ~14-minute step and, on
    # its own, ~75% of this workflow's wall clock. It is import-bound rather than
    # test-bound — a green run reported `import 1333.88s` against `tests 777.90s`
    # aggregated across workers, i.e. the per-file cost of pulling in MUI et al.
    # dominates the assertions themselves. Splitting the FILES across parallel
    # runners therefore scales almost linearly where adding local workers does
    # not, since each runner pays that import cost for only its own slice.
    #
    # To change the shard count, edit this list and nothing else: the
    # `--shard=i/n` denominator reads `strategy.job-total`, which GitHub derives
    # from the matrix, so the two can never drift out of sync.
    strategy:
      # Surface every failing shard in one run instead of cancelling siblings on
      # the first red — a partial picture here would cost a full extra CI cycle.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Deliberately NO enrichment-compute build and NO `prisma generate` here:
      # apps/web imports neither (verified — it has no @memoriahub/* dependency
      # and no source reference), so both steps would be dead weight on every
      # shard. If web ever gains such an import, add the build step back.
      #
      # Vitest shards by file, assigning each file to a shard by a hash of its
      # path, so the union of all shards is exactly the full suite and the split
      # is deterministic. Test counts across shards must sum to the single-job
      # total; if they ever don't, the split is dropping files, not balancing.
      - run: npm run test:ci --workspace=web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  cli-test:
    name: CLI Build & Test
    runs-on: ubuntu-latest
    # This job is unit tests only (no docker/QEMU/image build — that's the
    # separate, deliberately slow multi-arch worker image build in deploy.yml,
    # which this job must never touch or depend on).
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Same rationale as the build job: apps/cli imports @memoriahub/enrichment-compute
      # by subpath resolved against its git-ignored dist/, built fresh here.
      - run: npm run build --workspace=@memoriahub/enrichment-compute

      - run: npm run typecheck --workspace=@memoriahub/cli

      # Unit-scoped test run. Fixture-drift and one concurrency-flaky suite are
      # excluded and tracked in docs/ci-known-failing-tests.md.
      - run: npm run test:ci --workspace=@memoriahub/cli
