name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, runnable against any ref. Exists because a PR opened by a
  # token-authenticated app does not raise a `pull_request` event (GitHub's
  # recursion prevention), so a change to this workflow cannot otherwise be
  # exercised on its own branch before landing on main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below runs CONCURRENTLY — none declares `needs`. Wall-clock time to
# all-green is the SLOWEST job, never the sum, so the whole design is about
# flattening the longest job rather than removing work (issue #417).
#
# The five definitions expand to 15 runtime jobs (4 API shards + 8 web shards +
# typecheck + OpenAPI + CLI). Two rules keep that honest:
#
#   1. Test counts across a matrix MUST sum to the single-job total. Verified at
#      4x API = 8051 tests and 8x web = 249 files / 4988 tests. If a sum ever
#      drops, the split is losing files, not balancing them.
#   2. Both tools shard by hashing the file path, which balances FILE COUNT and
#      ignores duration — so the slowest shard, not the average, sets the wall
#      clock, and the spread widens as files-per-shard shrinks. Measured: web at
#      6 shards ran 55-97s, at 8 shards 37-82s. Halving the files bought only
#      15% off the max, and past that the fixed per-job floor (checkout +
#      setup-node + `npm ci`) dominates. That is why the counts are 4 and 8
#      rather than as high as possible — re-measure before changing them.
jobs:
  # Repository tooling for the platform adoption (RETRO-A3, #574): the pinned
  # @marinoscar/platform-* packages, one copy of every singleton, and no app
  # code reaching into a package's src/dist. No `needs:` — runs concurrently.
  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    env:
      # This job never loads onnxruntime: skip the native binary download, a
      # recurring CDN timeout during `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run check:platform-pin
      - run: node scripts/check-platform-pin.mjs --self-test
      - run: npm run check:single-instance
      - run: npm run check:platform-imports
      - run: npm run db:compose:check --workspace=api
      # infra/ is generated by @marinoscar/platform-infra (issue #566): a hand edit
      # to a generated file, or a lock that disagrees with the package, fails here.
      - run: npm run platform:infra:sync -- --check

  # Typechecking is separated from the test jobs deliberately: it is pure CPU on
  # already-provisioned inputs, so parking it behind the API suite (as it used to
  # be) added its full duration to the critical path for no reason.
  typecheck:
    name: Typecheck (api, web, cli)
    runs-on: ubuntu-latest
    env:
      # This job never loads onnxruntime: skip the native binary download, a
      # recurring CDN timeout during `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # apps/api and apps/cli both import @marinoscar/memoriahub-compute by
      # subpath (e.g. .../clip, .../dto) resolved against its built dist/ —
      # that output is git-ignored, so it must be built on every fresh checkout
      # before anything importing it can typecheck. (apps/web imports neither
      # this package nor Prisma — see the web-test job.)
      - run: npm run build --workspace=@marinoscar/memoriahub-compute
      - run: npm run build --workspace=@marinoscar/memoriahub-contract
      - run: npm run build --workspace=@marinoscar/memoriahub-api
      # apps/web imports @marinoscar/memoriahub-web by entry against its git-ignored dist/ (RETRO-J11).
      - run: npm run build --workspace=@marinoscar/memoriahub-web

      - run: npx prisma generate
        working-directory: apps/api

      # `--ignore-scripts` skips api's `pretypecheck` hook, which would otherwise
      # re-run `setup:deps` — rebuilding memoriahub-compute and regenerating the
      # Prisma client the two steps above just produced. The hook exists so a
      # fresh local checkout self-provisions on `npm run typecheck`; in CI the
      # provisioning is explicit, so the hook is pure duplicated work.
      - run: npm run typecheck --workspace=api --ignore-scripts
      - run: npm run typecheck --workspace=web
      - run: npm run typecheck --workspace=@memoriahub/cli

  api-test:
    name: API Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # To change the shard count, edit this list and nothing else: the
    # `--shard=i/n` denominator reads `strategy.job-total`, which GitHub derives
    # from the matrix, so the two can never drift out of sync. (Same pattern in
    # web-test below.)
    strategy:
      # Surface every failing shard in one run instead of cancelling siblings on
      # the first red — a partial picture would cost a full extra CI cycle.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build --workspace=@marinoscar/memoriahub-compute
      - run: npm run build --workspace=@marinoscar/memoriahub-contract
      - run: npm run build --workspace=@marinoscar/memoriahub-api

      - run: npx prisma generate
        working-directory: apps/api

      # Unit + integration test runs. The API's integration specs boot the full
      # AppModule over a mocked Prisma — they need no database, and since #220
      # they run here rather than being excluded wholesale. Remaining exclusions
      # are tracked in docs/ci-known-failing-tests.md.
      #
      # `test:ci` needs no `--ignore-scripts`: npm fires `pre<script>` only for an
      # exactly-matching name, and there is no `pretest:ci`, so nothing to skip.
      - run: npm run test:ci --workspace=api -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The real-Postgres tier (RETRO-J, #555). The *.db.spec.ts files skip when no
  # database listens, so the API shards above never ran them. This job gives them
  # one: pgvector Postgres, the migrations and the seed, then every *.db.spec.ts
  # in one process (some are destructive and share the database, so never in
  # parallel).
  #
  # The suites run as an ORDINARY role (RETRO-I3, #573): `memoriahub_app`, NOSUPERUSER NOBYPASSRLS, owner
  # of the database and so of every table the migrations create, which is how the forced row-level
  # security policies on the `org` tables apply to the whole suite, exactly as they do to the API. The
  # bootstrap superuser (`postgres`, a throwaway for this service container) is used only by the
  # "Create the application role" step below: to create the role and the `vector` extension (a
  # superuser-only extension) in `template1` and in the database, so the scratch databases some specs
  # create (`CREATE DATABASE` by the ordinary role, which holds CREATEDB and CREATEROLE, with `createrole_self_grant`, but neither
  # SUPERUSER nor BYPASSRLS) inherit it. The code under test never connects as the superuser.
  #
  # The seeding helpers set the row-level security scope the way production code does
  # (`set_config(name, value, true)` as the first statement of a transaction; test/helpers/library.ts,
  # test/helpers/org-scope.ts). A spec of MemoriaHub's own domain services, which still read the
  # organization tables on the plain client (docs/platform-adoption/local-exceptions.md, "API connects as
  # the bootstrap superuser"), takes the bypass explicitly on a connection of its own
  # (`rlsBypassPrisma`, the `app.rls_bypass` option), never a superuser. `test/tenancy/db-role.db.spec.ts`
  # fails this job if the role were ever a superuser or held BYPASSRLS.
  api-db-test:
    name: API DB tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: memoriahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # The ordinary application role created by the "Create the application role" step.
      POSTGRES_USER: memoriahub_app
      POSTGRES_PASSWORD: ci-app-throwaway
      POSTGRES_DB: memoriahub_test
      POSTGRES_SSL: 'false'
      DATABASE_URL: postgresql://memoriahub_app:ci-app-throwaway@localhost:5432/memoriahub_test
      REQUIRE_ORDINARY_DB_ROLE: '1'
      JWT_SECRET: ci-only-jwt-secret-minimum-32-characters-long
      SECRETS_ENCRYPTION_KEY: Y2ktb25seS10aHJvd2F3YXkta2V5LTMyLWJ5dGVzISE=
      INITIAL_ADMIN_EMAIL: admin@example.test
      OTEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # onnxruntime-node's install script downloads from nuget; nothing in the
      # DB tier loads it, and that download is a known flake.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: npm run build --workspace=@marinoscar/memoriahub-compute
      - run: npm run build --workspace=@marinoscar/memoriahub-contract
      - run: npm run build --workspace=@marinoscar/memoriahub-api

      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run build -w @marinoscar/memoriahub-db
      - run: npm run db:compose:check --workspace=api

      - name: Create the application role
        env:
          PGPASSWORD: ci-throwaway
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE memoriahub_app LOGIN PASSWORD 'ci-app-throwaway' NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE;
          ALTER DATABASE memoriahub_test OWNER TO memoriahub_app;
          -- A role it creates (the specs that build their own ordinary roles and databases) is granted back
          -- to it with SET, as `CREATE DATABASE ... OWNER <that role>` requires of a non-superuser.
          ALTER ROLE memoriahub_app SET createrole_self_grant = 'set,inherit';
          \c template1
          CREATE EXTENSION IF NOT EXISTS vector;
          \c memoriahub_test
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      - run: npm run prisma:migrate --workspace=api
      - run: npm run prisma:seed --workspace=api
      - run: npm run db:check:database --workspace=api

      - run: npm run test:db --workspace=api

  web-test:
    name: Web Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # The web suite (249 files / ~5k tests) was a single ~14-minute step and, on
    # its own, ~75% of this workflow's wall clock. It is import-bound rather than
    # test-bound: each file re-evaluates its whole module graph, because Vitest's
    # default `isolate: true` resets the worker's module registry per file. That
    # is the correct setting for this suite — it leans heavily on `vi.mock`, and
    # turning isolation off made the failure set depend on which files share a
    # worker (measured: 5 files failed in one shard vs a completely different 45
    # files on the full suite). So the fix is splitting FILES across runners,
    # which scales where adding local workers does not.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Installs ONLY apps/web's dependencies plus the workspace root, not the
      # other workspaces' — apps/web needs none of the API/CLI tree (Nest,
      # Prisma, onnxruntime, sharp). Measured: 22s and 465 MB against 56s and
      # 1.5 GB for the full install, and the suite passes identically on the
      # reduced tree. Worth doing here specifically because eight shards each
      # pay this cost. If apps/web ever depends on another workspace, this
      # filter must gain it or the job will fail to resolve it: it depends on
      # @marinoscar/memoriahub-contract (types only, erased by the test
      # transform, so no build step is needed here).
      - run: npm ci --workspace=web --workspace=@marinoscar/memoriahub-contract --workspace=@marinoscar/memoriahub-web --include-workspace-root
      # apps/web consumes @marinoscar/memoriahub-web (and its types) from the package's
      # git-ignored dist/ (RETRO-J11); the contract is a type-only import of it.
      - run: npm run build --workspace=@marinoscar/memoriahub-contract
      - run: npm run build --workspace=@marinoscar/memoriahub-web

      # Deliberately NO memoriahub-compute build and NO `prisma generate` here:
      # apps/web imports neither (verified — no source reference), so both would
      # be dead weight on all eight shards. If web ever gains such an import, add
      # the build step back. Its one package import, memoriahub-contract, is
      # `import type` only.
      - run: npm run test:ci --workspace=web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  openapi:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    # Declares no `needs`, like every other job here — it runs concurrently
    # and adds no wall-clock time as long as it stays under the slowest job.
    env:
      # This job never loads onnxruntime: skip the native binary download, a
      # recurring CDN timeout during `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip
      NODE_ENV: test
    steps:
      # Full history so the base branch can be checked out for the spec diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Same rationale as the build job: apps/api imports
      # @marinoscar/memoriahub-compute by subpath against its git-ignored dist/.
      - run: npm run build --workspace=@marinoscar/memoriahub-compute
      - run: npm run build --workspace=@marinoscar/memoriahub-contract
      - run: npm run build --workspace=@marinoscar/memoriahub-api

      - run: npx prisma generate
        working-directory: apps/api

      # The dump script boots the app in Nest's preview mode: every module is
      # loaded and every controller's metadata read, but no provider is
      # instantiated — so this needs no database, no object storage, and no
      # credentials, and starts no cron or worker loops.
      - name: Generate the spec
        run: npm run openapi:dump

      - name: Lint the spec
        run: npm run openapi:lint

      - name: Type-check the dump script
        run: npm run openapi:typecheck --workspace=api

      # A breaking API change should be visible in review rather than found by a
      # client. The base spec is produced from a worktree of the base branch that
      # borrows this checkout's installed node_modules and generated Prisma
      # client, so no second `npm ci` is needed.
      #
      # Best-effort by construction: a base branch that predates this job cannot
      # dump a spec at all, and dependency drift between the branches can make
      # the borrowed modules wrong. Both outcomes report "skipped" rather than
      # failing a PR over a diff that is informational.
      - name: Diff the spec against the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -uo pipefail
          git worktree add --detach /tmp/base "origin/${{ github.base_ref }}" || {
            echo "Could not check out the base branch; skipping spec diff." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/base/node_modules
          cp -r packages/memoriahub-compute/dist /tmp/base/packages/memoriahub-compute/dist

          if ! (cd /tmp/base && npm run openapi:dump >/tmp/base-dump.log 2>&1); then
            {
              echo "### OpenAPI spec diff skipped"
              echo
              echo 'The base branch could not produce a spec (it may predate this job, or its'
              echo 'dependencies differ from this branch). The generated spec is attached as an'
              echo 'artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if diff -u /tmp/base/openapi.json openapi.json > /tmp/spec.diff; then
            echo "No OpenAPI changes in this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### OpenAPI spec changes"
            echo
            echo "<details><summary>$(grep -c '^[+-]' /tmp/spec.diff) changed lines</summary>"
            echo
            echo '```diff'
            # Bounded: a job summary is capped at 1 MiB, and a full 1 MB spec
            # rewrite would blow past it and lose the summary entirely.
            head -c 60000 /tmp/spec.diff
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: openapi.json
          path: openapi.json

  cli-test:
    name: CLI Test
    runs-on: ubuntu-latest
    # Tests only — the CLI typecheck moved to the typecheck job above. No
    # docker/QEMU/image build either: that's the separate, deliberately slow
    # multi-arch worker image build in deploy.yml, which this must never touch
    # or depend on.
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Same rationale as the typecheck job: apps/cli imports
      # @marinoscar/memoriahub-compute by subpath against its git-ignored dist/.
      - run: npm run build --workspace=@marinoscar/memoriahub-compute
      - run: npm run build --workspace=@marinoscar/memoriahub-contract

      # apps/cli/src/infra-conformance.spec.ts runs `nginx -t` over infra/nginx
      # (issue #566); without a binary that case is registered as skipped.
      - run: sudo apt-get update -q && sudo apt-get install -y -q nginx-light

      # Unit-scoped test run. Fixture-drift and one concurrency-flaky suite are
      # excluded and tracked in docs/ci-known-failing-tests.md.
      - run: npm run test:ci --workspace=@memoriahub/cli
