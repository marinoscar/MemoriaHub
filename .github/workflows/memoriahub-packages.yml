name: MemoriaHub packages

# Build, check and pack the @marinoscar/memoriahub-* packages (today
# memoriahub-compute). The standard these jobs enforce: docs/PACKAGES.md.
#
# NOTHING IN THIS WORKFLOW PUBLISHES. Publishing is gated (ADR-0001,
# docs/runbooks/release-memoriahub-packages.md): the packages are
# "private": true until the owner chooses a registry, there is no registry
# credential, and no job runs `npm publish`. The release workflow (RETRO-J12)
# will default to a dry run.
#
# `ci.yml` builds the compute package for the app test jobs; this workflow adds
# the checks that only matter when a package changes (docs, peers, pack,
# smoke imports, the package's own tests) and runs on the paths below. The
# bare-host job arrives with RETRO-J12.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/memoriahub-*/**'
      - 'packages/memoriahub-*.json'
      - 'scripts/memoriahub-packages/**'
      - 'scripts/check-single-instance.mjs'
      - '.changeset/**'
      - 'eslint.config.mjs'
      - 'typedoc.base.json'
      - 'tsdoc.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/package.json'
      - 'apps/cli/package.json'
      - 'apps/web/package.json'
      - '.github/workflows/memoriahub-packages.yml'
  push:
    branches: [main]
    paths:
      - 'packages/memoriahub-*/**'
      - 'packages/memoriahub-*.json'
      - 'scripts/memoriahub-packages/**'
      - 'scripts/check-single-instance.mjs'
      - '.changeset/**'
      - 'eslint.config.mjs'
      - 'typedoc.base.json'
      - 'tsdoc.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/package.json'
      - 'apps/cli/package.json'
      - 'apps/web/package.json'
      - '.github/workflows/memoriahub-packages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, check and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install ffmpeg (background) and dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) &
          apt_pid=$!
          npm ci
          wait "$apt_pid"

      - run: npm run build:memoriahub-packages
      - run: npm run typecheck:memoriahub-packages
      # Rules graph, peers-data, manifest, imports and host-neutral for the
      # packages, then app-installs for the two apps that depend on them.
      - run: npm run check:memoriahub-slice-peers
      # The check scripts themselves, against fixtures (including a file that
      # breaks the host-neutral rule).
      - run: npm run test:memoriahub-scripts
      # The package's own suite: golden vectors, ffmpeg argv pins, DTO and
      # geo/social/video unit tests. The HEIC and golden gates run again, against
      # the built images, in deploy.yml.
      - run: npm run test:memoriahub-packages
      # Asks npm what each package would publish and compares it with the
      # manifest. Needs the build above.
      - run: npm run check:memoriahub-pack
      # Installs the packed package alone into an empty project and asserts no
      # platform package and no provider SDK is in the tree. Needs the build
      # above and the registry (for sharp, onnxruntime-node, exifr, zod).
      - run: npm run check:memoriahub-lean-install
      # The domain schema package: the app's installed copies (fragments, lock) are
      # byte-identical to it, and the command runs. Needs the build above.
      - run: npm run db:check --workspace=api
      - run: node packages/memoriahub-db/bin/memoriahub-db.js --help

      # Every entry point must load from the module system it advertises. The
      # packages resolve through the workspace links `npm ci` created.
      - name: Smoke-import every entry point
        run: |
          for slice in image clip dhash ffmpeg video metadata geo rate-limit face-compreface face-video ocr social dto; do
            node -e "require('@marinoscar/memoriahub-compute/$slice')"
            node --input-type=module -e "await import('@marinoscar/memoriahub-compute/$slice')"
          done
          node -e "require('@marinoscar/memoriahub-compute')"
          node --input-type=module -e "await import('@marinoscar/memoriahub-compute')"
          # The contract: every slice is a subpath of the same name.
          for slice in $(node -p "Object.keys(require('./packages/memoriahub-slices.json')['memoriahub-contract']).join(' ')"); do
            node -e "require('@marinoscar/memoriahub-contract/$slice')"
            node --input-type=module -e "await import('@marinoscar/memoriahub-contract/$slice')"
          done
          node -e "require('@marinoscar/memoriahub-contract')"
          node --input-type=module -e "await import('@marinoscar/memoriahub-contract')"
          # The api package: CommonJS, one subpath per slice and no root entry.
          for slice in $(node -p "Object.keys(require('./packages/memoriahub-slices.json')['memoriahub-api']).join(' ')"); do
            node -e "require('@marinoscar/memoriahub-api/$slice')"
            node --input-type=module -e "await import('@marinoscar/memoriahub-api/$slice')"
          done
          # The web package: ESM. Only the entries that load in Node without a bundler
          # (the headless ones, the brand and the shell data); the ui entries import CSS.
          for entry in core/headless media/headless brand shell; do
            node --input-type=module -e "await import('@marinoscar/memoriahub-web/$entry')"
          done

  db-apply:
    name: memoriahub-db against PostgreSQL
    # test/apply.db.test.ts builds the platform history plus the baseline on one
    # database and the web app's whole history on another, runs check --database
    # on both and compares the two domain schemas (RETRO-J3, #606).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: npm run build -w @marinoscar/memoriahub-db
      - run: npm run test:run -w @marinoscar/memoriahub-db
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/postgres

  package-docs:
    name: Package docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # TypeDoc for the packages (fails on an undocumented export or a broken
      # {@link}), then README, TSDoc tag and entry-point checks.
      - run: npm run check:memoriahub-package-docs

  single-instance:
    name: Single instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: node scripts/memoriahub-packages/check-single-instance.mjs --root . --guard '@marinoscar/platform-*' --guard '@marinoscar/memoriahub-*'

  changeset-status:
    name: Changeset status
    # A pull request that changes a package source needs a changeset. The
    # version pull request of the release workflow (RETRO-J12) consumes the
    # changesets and is the one exception.
    if: github.event_name == 'pull_request' && github.head_ref != 'memoriahub-release/version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: git fetch origin main
      - run: npx changeset status --since=origin/main
